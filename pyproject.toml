[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-incident-response-agent"
version = "0.1.0"
description = "A local-first agentic RAG prototype for defensive incident response"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb>=1.0,<2",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "sentence-transformers>=3.2,<6",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "load_tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
