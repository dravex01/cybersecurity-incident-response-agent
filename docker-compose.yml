services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      CHROMA_PATH: /app/storage/chroma
      KNOWLEDGE_BASE_PATH: /app/data/knowledge_base
      TOP_K: ${TOP_K:-5}
      CONTEXT_THRESHOLD: ${CONTEXT_THRESHOLD:-0.45}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-2}
      MAX_RAG_RETRIES: ${MAX_RAG_RETRIES:-1}
      ENABLE_RERANKER: ${ENABLE_RERANKER:-true}
      CHUNK_SIZE: ${CHUNK_SIZE:-850}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      COLLECTION_NAME: ${COLLECTION_NAME:-cybersecurity_incident_response}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTAINERIZED: "true"
    volumes:
      - chroma_data:/app/storage/chroma
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.10
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:
  ollama_data:
